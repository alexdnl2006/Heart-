<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corazón de 500 estrellas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      font-family: system-ui, sans-serif;
    }
    .scene {
      position: relative;
      width: min(100vw, 600px);
      aspect-ratio: 1;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }
    button {
      position: absolute;
      right: 18px;
      bottom: 18px;
      padding: 9px 13px;
      border: 1px solid #a855f7;
      border-radius: 999px;
      color: #fff;
      background: rgba(20, 8, 31, .82);
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { background: #a855f7; }
  </style>
</head>
<body>
  <main class="scene">
    <canvas id="heart" width="600" height="600" aria-label="Animación de 500 estrellas formando un corazón"></canvas>
    <button id="replay" type="button">Repetir</button>
  </main>
  <script>
    const canvas = document.getElementById('heart');
    const ctx = canvas.getContext('2d');
    const replay = document.getElementById('replay');
    const count = 500;
    const duration = 1275;
    let stars = [];
    let animationId;

    const random = (min, max) => min + Math.random() * (max - min);

    function makeStars() {
      stars = [];
      for (let i = 0; i < count; i++) {
        const a = 2 * Math.PI * (i / count);
        const targetX = 300 + 16 * Math.sin(a) ** 3 * 11 + random(-15, 15);
        const targetY = 300 - (
          13 * Math.cos(a)
          - 5 * Math.cos(2 * a)
          - 2 * Math.cos(3 * a)
          - Math.cos(4 * a)
        ) * 11 + random(-15, 15);

        stars.push({
          startX: random(-20, 620),
          startY: random(-20, 620),
          targetX,
          targetY,
          size: random(2.5, 5.5)
        });
      }
    }

    function draw(progress) {
      ctx.clearRect(0, 0, 600, 600);
      const eased = Math.sin(progress * Math.PI / 2);
      ctx.beginPath();
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';

      for (const star of stars) {
        const x = star.startX + (star.targetX - star.startX) * eased;
        const y = star.startY + (star.targetY - star.startY) * eased;
        const diagonal = star.size * Math.SQRT1_2;
        ctx.moveTo(x - star.size, y);
        ctx.lineTo(x + star.size, y);
        ctx.moveTo(x - diagonal, y - diagonal);
        ctx.lineTo(x + diagonal, y + diagonal);
        ctx.moveTo(x, y - star.size);
        ctx.lineTo(x, y + star.size);
        ctx.moveTo(x - diagonal, y + diagonal);
        ctx.lineTo(x + diagonal, y - diagonal);
      }
      ctx.stroke();
    }

    function start() {
      cancelAnimationFrame(animationId);
      makeStars();
      const startedAt = performance.now();
      function frame(now) {
        const progress = Math.min((now - startedAt) / duration, 1);
        draw(progress);
        if (progress < 1) animationId = requestAnimationFrame(frame);
      }
      animationId = requestAnimationFrame(frame);
    }

    replay.addEventListener('click', start);
    start();
  </script>
</body>
</html>
